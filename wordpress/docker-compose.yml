# Local WordPress for editing Olea content. Start it with ./setup.sh.
name: olea-wordpress

x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  # Where "View post" links and front-end visitors are sent.
  OLEA_SITE_URL: ${OLEA_SITE_URL:-http://localhost:3000}
  # Called after every content save so the site shows the edit straight away.
  OLEA_REVALIDATE_URL: ${OLEA_REVALIDATE_URL:-http://host.docker.internal:3000/api/revalidate}
  OLEA_REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}

x-wordpress-volumes: &wordpress-volumes
  - wordpress:/var/www/html
  - ./plugin/olea-content:/var/www/html/wp-content/plugins/olea-content
  - ./scripts:/scripts:ro
  # The site's public files, for scripts that upload one to the media library.
  - ../public:/public:ro
  # Source copies of the menu PDFs, for the scripts that upload them. The site links to the CMS copies.
  - ./menus:/menus:ro

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wordpress:
    image: wordpress:apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *wordpress-env
    volumes: *wordpress-volumes

  # WP-CLI, run on demand: docker compose run --rm cli wp <command>
  cli:
    image: wordpress:cli
    profiles: [tools]
    depends_on:
      - wordpress
    # Same user as the web server, so files it writes stay writable by WordPress.
    user: "33:33"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *wordpress-env
    volumes: *wordpress-volumes

volumes:
  db:
  wordpress:
